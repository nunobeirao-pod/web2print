<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#4A4FE4"/><text x="100" y="115" font-size="64" fill="#fff" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">W2P</text></svg></template>
<button onClick="{{ onClick }}" title="{{ label }}" aria-label="{{ label }}" style="position:relative;width:{{ size }}px;height:{{ size }}px;border-radius:8px;background:{{ color }};border:1px solid rgba(28,27,25,.12);box-shadow:{{ ring }};cursor:pointer;padding:0">
  <span style="position:absolute;top:50%;left:50%;width:{{ tapSize }}px;height:{{ tapSize }}px;transform:translate(-50%,-50%)"></span>
</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F2A44&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Navy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const selected = !!this.props.selected;
    const size = this.props.size ?? 32;
    return {
      color: this.props.color ?? '#1C1B19',
      label: this.props.label ?? '',
      size,
      tapSize: Math.max(44, size),
      ring: selected ? '0 0 0 2px #fff, 0 0 0 4px #1C1B19' : 'none',
      onClick: this.props.onClick || (() => {})
    };
  }
}

</script>
</body>
</html>
