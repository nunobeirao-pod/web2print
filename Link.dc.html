<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#4A4FE4"/><text x="100" y="115" font-size="64" fill="#fff" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">W2P</text></svg></template>
<a href="{{ href }}" target="{{ target }}" style="font-size:{{ size }};font-weight:{{ weight }};color:{{ ink }};text-decoration:none;border-radius:3px;outline-offset:3px" style-hover="text-decoration:underline" style-focus="outline:2px solid #4A4FE4;text-decoration:underline">{{ label }}</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:30},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Edit design&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;brand&quot;,&quot;options&quot;:[&quot;ink&quot;,&quot;brand&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone || 'ink';
    return {
      label: this.props.label ?? 'Link',
      href: this.props.href ?? '#',
      target: this.props.target ?? '_self',
      ink: tone === 'brand' ? '#4A4FE4' : '#1C1B19',
      size: this.props.size ?? '13px',
      weight: this.props.weight ?? 600
    };
  }
}

</script>
</body>
</html>
