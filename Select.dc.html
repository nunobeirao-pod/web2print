<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<select value="{{ value }}" onChange="{{ onChange }}" disabled="{{ disabled }}" style="width:100%;box-sizing:border-box;border:1px solid {{ borderColor }};border-radius:8px;padding:14px 16px;font-size:14px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:{{ bg }};color:{{ ink }};outline:none" style-focus="border-color:#4A4FE4;outline:2px solid #4A4FE4;outline-offset:1px">
  <sc-for list="{{ options }}" as="opt" hint-placeholder-count="3">
    <option value="{{ opt }}">{{ opt }}</option>
  </sc-for>
</select>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:50},&quot;options&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;Portugal&quot;,&quot;Spain&quot;,&quot;France&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const disabled = !!this.props.disabled;
    return {
      options: this.props.options ?? ['Portugal', 'Spain', 'France'],
      value: this.props.value ?? '',
      onChange: this.props.onChange || (() => {}),
      disabled,
      borderColor: disabled ? '#E6E2D8' : '#DDD8CC',
      bg: disabled ? '#F3F0E9' : '#FFFFFF',
      ink: disabled ? '#B8B2A5' : '#1C1B19'
    };
  }
}

</script>
</body>
</html>
