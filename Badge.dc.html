<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#4A4FE4"/><text x="100" y="115" font-size="64" fill="#fff" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">W2P</text></svg></template>
<span style="display:inline-flex;align-items:center;background:{{ bg }};color:{{ ink }};border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;white-space:nowrap">{{ label }}</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:30},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;In production&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;success&quot;,&quot;options&quot;:[&quot;success&quot;,&quot;error&quot;,&quot;info&quot;,&quot;neutral&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone || 'neutral';
    const map = {
      success: { bg: '#EDF2EA', ink: '#41573B' },
      error: { bg: '#FDECEA', ink: '#C42B2B' },
      info: { bg: '#F4F4FE', ink: '#4A4FE4' },
      neutral: { bg: '#F3F0E9', ink: '#4A473F' }
    };
    const c = map[tone] || map.neutral;
    return { label: this.props.label ?? 'Badge', bg: c.bg, ink: c.ink };
  }
}

</script>
</body>
</html>
