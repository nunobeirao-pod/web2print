<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
body{margin:0;background:#FBFAF8}

</style>
</helmet>
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><dc-import name="Homepage" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isCatalogue }}" hint-placeholder-val="{{ false }}"><dc-import name="Catalogue" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isProduct }}" hint-placeholder-val="{{ false }}"><dc-import name="Product Page" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isEditor }}" hint-placeholder-val="{{ false }}"><dc-import name="Editor" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isCheckout }}" hint-placeholder-val="{{ false }}"><dc-import name="Checkout" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isAuth }}" hint-placeholder-val="{{ false }}"><dc-import name="Authentication" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isAI }}" hint-placeholder-val="{{ false }}"><dc-import name="AI Studio" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isDashboard }}" hint-placeholder-val="{{ false }}"><dc-import name="Dashboard" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isSupport }}" hint-placeholder-val="{{ false }}"><dc-import name="Support" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isCompany }}" hint-placeholder-val="{{ false }}"><dc-import name="Company" hint-size="100%,100vh"></dc-import></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { route: 'Homepage' };
  static ROUTES = ['Homepage', 'Catalogue', 'Product Page', 'Editor', 'Checkout', 'Authentication', 'AI Studio', 'Dashboard', 'Support', 'Company'];
  componentDidMount() {
    const toRoute = f => decodeURIComponent(f).replace(/\.dc\.html$/, '');
    window.__navigate = f => {
      const r = toRoute(f);
      if (Component.ROUTES.indexOf(r) === -1) return;
      this.setState({ route: r });
      window.scrollTo(0, 0);
      try { history.replaceState(null, '', '#' + r.replace(/ /g, '-')); } catch (e) {}
    };
    this._click = e => {
      const a = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      const h = a.getAttribute('href') || '';
      if (h.indexOf('.dc.html') !== -1) {
        e.preventDefault();
        const parts = h.split('/').pop().split('#');
        if (parts[1]) window.__sectionHint = parts[1];
        window.__navigate(parts[0]);
      }
    };
    document.addEventListener('click', this._click, true);
    const h = decodeURIComponent((location.hash || '').slice(1)).replace(/-/g, ' ');
    if (Component.ROUTES.indexOf(h) !== -1 && h !== this.state.route) this.setState({ route: h });
  }
  componentWillUnmount() {
    document.removeEventListener('click', this._click, true);
    if (window.__navigate) delete window.__navigate;
  }
  renderVals() {
    const r = this.state.route;
    return {
      isHome: r === 'Homepage', isCatalogue: r === 'Catalogue', isProduct: r === 'Product Page',
      isEditor: r === 'Editor', isCheckout: r === 'Checkout', isAuth: r === 'Authentication',
      isAI: r === 'AI Studio', isDashboard: r === 'Dashboard', isSupport: r === 'Support', isCompany: r === 'Company',
    };
  }
}
</script>
