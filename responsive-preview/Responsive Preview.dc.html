<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:#FBFAF8;color:#1C1B19;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}</style></helmet>
<div data-screen-label="Responsive Preview">
  <div style="position:sticky;top:0;z-index:10;background:#1C1B19;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px">
    <span>Preview tool — not a page in the site. Viewport: <strong>{{ width }}px</strong> → showing <strong>{{ modeLabel }}</strong></span>
    <span style="flex:1"></span>
    <dc-import name="Button" label="Force Mobile" variant="{{ mobileBtnVariant }}" onClick="{{ forceMobile }}" hint-size="110,34"></dc-import>
    <dc-import name="Button" label="Force Desktop" variant="{{ desktopBtnVariant }}" onClick="{{ forceDesktop }}" hint-size="120,34"></dc-import>
    <dc-import name="Button" label="Auto (resize window)" variant="{{ autoBtnVariant }}" onClick="{{ forceAuto }}" hint-size="150,34"></dc-import>
  </div>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}">
    <div style="max-width:390px;margin:0 auto">
      <dc-import name="Homepage Mobile" hint-size="100%,1400"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Homepage" hint-size="100%,3000"></dc-import>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1280, forced: null };

  componentDidMount() {
    this._onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }

  renderVals() {
    const width = this.state.width;
    const forced = this.state.forced;
    const isMobile = forced === 'mobile' ? true : (forced === 'desktop' ? false : width < 768);
    return {
      width,
      isMobile,
      isDesktop: !isMobile,
      modeLabel: isMobile ? 'Homepage Mobile' : 'Homepage (Desktop)',
      mobileBtnVariant: forced === 'mobile' ? 'brand' : 'secondary',
      desktopBtnVariant: forced === 'desktop' ? 'brand' : 'secondary',
      autoBtnVariant: forced === null ? 'brand' : 'secondary',
      forceMobile: () => this.setState({ forced: 'mobile' }),
      forceDesktop: () => this.setState({ forced: 'desktop' }),
      forceAuto: () => this.setState({ forced: null })
    };
  }
}

</script>
</body>
</html>
