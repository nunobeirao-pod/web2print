<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes btnSpin{to{transform:rotate(360deg)}}</style></helmet>
<button onClick="{{ onClick }}" disabled="{{ isDisabled }}" style="height:{{ height }};padding:{{ padding }};border-radius:{{ radius }};border:{{ border }};background:{{ bg }};color:{{ ink }};font-size:14px;font-weight:600;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;cursor:{{ cursor }};width:{{ width }};white-space:nowrap;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px" style-hover="background:{{ hoverBg }};border-color:{{ hoverBorderColor }}" style-focus="outline:2px solid #4A4FE4;outline-offset:2px">
  <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><span style="width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;display:inline-block;animation:btnSpin 0.7s linear infinite"></span></sc-if>
  {{ label }}
</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:56},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Checkout Now&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;primary&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;secondary&quot;,&quot;tertiary&quot;,&quot;brand&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fullWidth&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant || 'primary';
    const disabled = !!this.props.disabled;
    const map = {
      primary: { bg: '#1C1B19', ink: '#FFFFFF', border: 'none', hoverBg: '#3A3833', radius: '999px', height: '44px', padding: '0 22px' },
      secondary: { bg: '#FFFFFF', ink: '#1C1B19', border: '1px solid #DDD8CC', hoverBorder: true, radius: '999px', height: '44px', padding: '0 22px' },
      tertiary: { bg: 'transparent', ink: '#1C1B19', border: 'none', hoverBg: '#F3F0E9', radius: '8px', height: '34px', padding: '0 14px' },
      brand: { bg: '#4A4FE4', ink: '#FFFFFF', border: 'none', hoverBg: '#3B40C9', radius: '999px', height: '44px', padding: '0 22px' }
    };
    const v = map[variant] || map.primary;
    const isPrimaryLike = variant === 'primary' || variant === 'brand';
    const loading = !!this.props.loading;
    return {
      isLoading: loading,
      label: loading ? (this.props.loadingLabel ?? 'Loading…') : (this.props.label ?? 'Button'),
      height: v.height, padding: v.padding, radius: v.radius,
      border: v.border,
      bg: disabled ? (isPrimaryLike ? '#C9C6BB' : v.bg) : v.bg,
      ink: disabled ? (isPrimaryLike ? '#FFFFFF' : '#B8B2A5') : v.ink,
      hoverBg: disabled ? (isPrimaryLike ? '#C9C6BB' : v.bg) : (v.hoverBg || v.bg),
      hoverBorderColor: (!disabled && v.hoverBorder) ? '#1C1B19' : 'transparent',
      cursor: (disabled || loading) ? 'not-allowed' : 'pointer',
      width: this.props.fullWidth ? '100%' : 'auto',
      isDisabled: disabled || loading,
      onClick: (disabled || loading) ? (() => {}) : (this.props.onClick || (() => {}))
    };
  }
}

</script>
</body>
</html>
